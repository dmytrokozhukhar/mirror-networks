<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirror CRM v1.0 (B2B Audit Tracking)</title>
  <style>
    :root {
      --bg: #0a0f18; --card: #111827; --muted: #9ca3af;
      --accent: #10b981; --accent-2: #059669; --white: #f3f4f6;
    }
    body {
      font-family: Inter, sans-serif; margin: 0; color: var(--white);
      background: var(--bg); min-height: 100vh;
    }
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); width: 350px; text-align: center; }
    .dashboard { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .stat-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin-top: 10px; }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .add-section-wrapper { margin-bottom: 20px; }
    .add-form { 
      background: var(--card); border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 25px; align-items: end;
    }
    input, select { 
      width: 100%; padding: 0 15px; background: #0f1724; border: 1px solid rgba(255,255,255,0.1); 
      color: white; border-radius: 10px; outline: none; height: 48px; font-size: 0.95rem;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn-primary { 
      background: var(--accent); color: #fff; padding: 0 20px; height: 48px; border-radius: 10px; 
      font-weight: 700; border: none; cursor: pointer; width: 100%;
    }
    .table-container { overflow-x: auto; background: var(--card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 18px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; text-transform: uppercase; }
    td { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--white); }
    .badge-paid { background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <h2 style="color: var(--accent);">Mirror CRM</h2>
      <input type="password" id="adminPass" placeholder="Security Token" style="margin-bottom: 15px;">
      <button class="btn-primary" onclick="login()">Access Dashboard</button>
    </div>
  </div>

  <div id="dashboard" class="admin-container dashboard">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1>Audit Dashboard <span style="color: var(--accent);">Mirror Networks</span></h1>
      <button onclick="location.reload()" style="background:#1e293b; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Logout</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-number" id="totalRevenue">€0</div></div>
      <div class="stat-card"><div class="stat-label">Active Audits</div><div class="stat-number" id="totalSales">0</div></div>
    </div>

    <div class="add-section-wrapper">
      <div class="add-form">
        <div><label>Target IP</label><input type="text" id="txnInput" placeholder="127.0.0.1"></div>
        <div><label>Client Email</label><input type="email" id="emailInput" placeholder="client@company.com"></div>
        <div>
          <label>Package</label>
          <select id="productInput">
            <option value="Basic Audit">Basic Audit (€230)</option>
            <option value="Express Mitigation">Express Mitigation (€250)</option>
            <option value="Advanced Hardening">Advanced Hardening (€300)</option>
          </select>
        </div>
        <div><label>Price</label><input type="number" id="priceInput" value="230"></div>
        <div><button class="btn-primary" onclick="addSale()">+ Log Audit</button></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Email</th>
            <th>Target IP</th>
            <th>Service</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const PASSWORD = "admin"; // Твой пароль
    let sales = [];

    document.getElementById('productInput').addEventListener('change', function() {
      if(this.value === "Basic Audit") document.getElementById('priceInput').value = 230;
      if(this.value === "Express Mitigation") document.getElementById('priceInput').value = 250;
      if(this.value === "Advanced Hardening") document.getElementById('priceInput').value = 300;
    });

    function login() {
      if (document.getElementById('adminPass').value === PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
      }
    }

    function addSale() {
      const email = document.getElementById('emailInput').value;
      const ip = document.getElementById('txnInput').value;
      const price = parseFloat(document.getElementById('priceInput').value);
      const product = document.getElementById('productInput').value;

      if(!email || !ip) return alert("Fill IP and Email");

      sales.push({ date: new Date().toLocaleDateString(), email, ip, product, price });
      render();
    }

    function render() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = "";
      let total = 0;
      sales.forEach(s => {
        total += s.price;
        tbody.innerHTML += `<tr><td>${s.date}</td><td>${s.email}</td><td>${s.ip}</td><td>${s.product}</td><td style="color:var(--accent); font-weight:bold;">€${s.price}</td><td><span class="badge-paid">Paid</span></td></tr>`;
      });
      document.getElementById('totalRevenue').innerText = `€${total}`;
      document.getElementById('totalSales').innerText = sales.length;
    }
  </script>
</body>
</html>
