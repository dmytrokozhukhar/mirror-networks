<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirror CRM v1.6 (Ultimate Workflow)</title>
  <style>
    :root {
      --bg: #0a0f18; --card: #111827; --muted: #9ca3af;
      --accent: #10b981; --process: #f59e0b; --white: #f3f4f6;
    }
    body {
      font-family: Inter, system-ui, -apple-system; margin: 0;
      color: var(--white); background: linear-gradient(180deg, #071025 0%, #0a0f18 60%);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .admin-container { max-width: 1300px; margin: 0 auto; padding: 20px; }
    .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); width: 350px; text-align: center; }
    .dashboard { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .stat-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin-top: 10px; }
    .add-section-wrapper { position: relative; margin-bottom: 20px; padding-top: 15px; }
    .form-trigger { height: 10px; width: 100%; background: transparent; cursor: pointer; }
    .add-form { 
      background: var(--card); border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.3);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; align-items: end;
      max-height: 0; opacity: 0; overflow: hidden; padding: 0 25px; transition: all 0.5s ease;
    }
    .add-section-wrapper:hover .add-form, .add-form.locked { max-height: 600px; opacity: 1; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-color: var(--accent); }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    input, select { width: 100%; padding: 0 15px; background: #0f1724; border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; height: 48px; outline: none; box-sizing: border-box; }
    input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .btn-primary { background: linear-gradient(90deg, var(--accent), #059669); color: #fff; height: 48px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; width: 100%; }
    .table-container { overflow-x: auto; background: var(--card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 18px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.06); }
    td { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; white-space: nowrap; }
    .action-buttons { display: flex; gap: 12px; opacity: 0; transition: 0.2s; justify-content: flex-end; }
    tr:hover .action-buttons { opacity: 1; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: inline-block; }
    .bg-paid { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
    .bg-refund { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .bg-process { background: rgba(245, 158, 11, 0.1); color: var(--process); }
    .bg-complete { background: rgba(16, 185, 129, 0.2); color: #fff; border: 1px solid var(--accent); }
    .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 36, 0.8); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" class="loader-overlay"><div class="loader"></div></div>
  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <h2 style="color: var(--accent); margin-bottom: 25px;">Mirror CRM</h2>
      <input type="password" id="adminPass" placeholder="Password" style="margin-bottom: 15px;">
      <button class="btn-primary" onclick="login()">Login</button>
      <p id="loginError" style="color: #ef4444; margin-top: 15px; display: none; font-weight: 600;">Denied</p>
    </div>
  </div>

  <div id="dashboard" class="admin-container dashboard">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1 style="font-size: 1.8rem;">Audit Dashboard <span style="color: var(--accent);">Mirror Networks</span></h1>
      <button onclick="location.reload()" style="background:#1e293b; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight: 600;">Logout</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div>NET REVENUE</div><div class="stat-number" id="totalRevenue">€0</div></div>
      <div class="stat-card"><div>TOTAL AUDITS</div><div class="stat-number" id="totalSales">0</div></div>
    </div>

    <div class="add-section-wrapper">
      <div class="form-trigger"></div>
      <div class="add-form" id="addForm">
        <div><label>Scan Date</label><input type="date" id="datePart"></div>
        <div><label>Scan Time</label><input type="time" id="timePart" step="1"></div>
        <div><label>Target IP</label><input type="text" id="txnInput" placeholder="1.1.1.1"></div>
        <div><label>Client Email</label><input type="email" id="emailInput" placeholder="client@company.com"></div>
        <div><label>Tier</label>
          <select id="productInput">
            <option value="Basic Audit">Basic Audit (€230)</option>
            <option value="Express Mitigation">Express Mitigation (€250)</option>
            <option value="Advanced Hardening">Advanced Hardening (€300)</option>
          </select>
        </div>
        <div><label>Payment</label>
          <select id="statusInput">
            <option value="Paid">Paid</option>
            <option value="Refunded">Refunded</option>
          </select>
        </div>
        <div><label>Work Status</label>
          <select id="workInput">
            <option value="Process">Process</option>
            <option value="Complete">Complete</option>
          </select>
        </div>
        <div><button id="submitBtn" class="btn-primary" onclick="handleFormSubmit()">+ Sync Record</button></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date / Time</th>
            <th>Target IP</th>
            <th>Email</th>
            <th>Tier</th>
            <th>Status (Pay/Work)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69a582c4d0ea881f40e763d3"; 
    const API_KEY = "$2a$10$S3z8IltwDwTfbcs0rgp6leyEsgIbfjXK4t8.PS1Eer1GxxuQGAtfK";
    const PASSWORD = "admin123$"; 
    let salesData = [];
    let editingId = null;

    setNow();
    document.querySelectorAll('.add-form input, .add-form select').forEach(el => el.addEventListener('focus', () => document.getElementById('addForm').classList.add('locked')));

    function setNow() {
        const now = new Date();
        document.getElementById('datePart').value = now.toISOString().split('T')[0];
        document.getElementById('timePart').value = now.toTimeString().split(' ')[0];
    }

    function login() {
      if (document.getElementById('adminPass').value === PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else { document.getElementById('loginError').style.display = 'block'; }
    }

    async function loadData() {
      showLoader(true);
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        if (!res.ok) throw new Error("Load failed: " + res.status);
        const d = await res.json();
        salesData = Array.isArray(d.record) ? d.record : [];
        renderTable();
      } catch (e) { alert("❌ Load Error: " + e.message); }
      showLoader(false);
    }

    async function handleFormSubmit() {
      const email = document.getElementById('emailInput').value;
      const ip = document.getElementById('txnInput').value;
      const dateVal = document.getElementById('datePart').value;
      const timeVal = document.getElementById('timePart').value;
      const product = document.getElementById('productInput').value;
      const status = document.getElementById('statusInput').value;
      const work = document.getElementById('workInput').value;
      
      let price = (product === "Basic Audit") ? 230 : (product === "Express Mitigation" ? 250 : 300);

      if(!email || !ip) return alert("Fill Email and IP");

      showLoader(true);
      const record = { 
          id: editingId || Date.now(), date: `${dateVal} ${timeVal}`, rawDate: dateVal, rawTime: timeVal,
          email, ip, product, price, status, workStatus: work
      };

      const backup = [...salesData];
      if (editingId) {
          const i = salesData.findIndex(s => s.id === editingId);
          salesData[i] = record;
      } else { salesData.push(record); }

      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(salesData)
        });

        if (!response.ok) throw new Error("Server denied: " + response.status);

        editingId = null; 
        document.getElementById('addForm').classList.remove('locked');
        document.getElementById('submitBtn').innerText = "+ Sync Record"; 
        document.getElementById('emailInput').value = ""; document.getElementById('txnInput').value = "";
        setNow(); renderTable();
        alert("✅ Synced with cloud!");
      } catch (e) { 
        salesData = backup;
        alert("❌ Sync Error: " + e.message); 
      }
      showLoader(false);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ""; let revenue = 0;
      salesData.sort((a,b) => b.id - a.id).forEach(sale => {
        if (sale.status === 'Paid') revenue += sale.price;
        const pBadge = sale.status === 'Paid' ? 'bg-paid' : 'bg-refund';
        const wBadge = (sale.workStatus || 'Process') === 'Process' ? 'bg-process' : 'bg-complete';
        
        tbody.innerHTML += `
          <tr>
            <td style="font-family:monospace; color:var(--muted);">${sale.date}</td>
            <td style="font-family:monospace;">${sale.ip || '-'}</td>
            <td>${sale.email}</td>
            <td>${sale.product}</td>
            <td><span class="badge ${pBadge}">${sale.status}</span> / <span class="badge ${wBadge}">${sale.workStatus || 'Process'}</span></td>
            <td><div class="action-buttons">
              <button style="background:none; border:none; cursor:pointer; font-size:1.2rem;" onclick="editSale(${sale.id})">✏️</button>
              <button style="background:none; border:none; cursor:pointer; font-size:1.2rem;" onclick="deleteSale(${sale.id})">🗑️</button>
            </div></td>
          </tr>`;
      });
      document.getElementById('totalRevenue').innerText = `€${revenue}`;
      document.getElementById('totalSales').innerText = salesData.length;
    }

    function editSale(id) {
      const item = salesData.find(s => s.id === id);
      document.getElementById('datePart').value = item.rawDate;
      document.getElementById('timePart').value = item.rawTime;
      document.getElementById('emailInput').value = item.email;
      document.getElementById('txnInput').value = item.ip;
      document.getElementById('productInput').value = item.product;
      document.getElementById('statusInput').value = item.status;
      document.getElementById('workInput').value = item.workStatus || 'Process';
      editingId = id; document.getElementById('submitBtn').innerText = "💾 Save";
      document.getElementById('addForm').classList.add('locked');
      window.scrollTo(0,0);
    }

    async function deleteSale(id) {
      if(!confirm("Delete?")) return;
      showLoader(true);
      salesData = salesData.filter(s => s.id !== id);
      try {
          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(salesData) });
          renderTable();
      } catch (e) { alert("Delete error"); }
      showLoader(false);
    }

    function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
  </script>
</body>
</html>
