<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mirror CRM v1.6 — Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0f18; --card: #111827; --accent: #10b981; --process: #f59e0b; --text: #f3f4f6; --muted: #9ca3af; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card-box { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); }
    .stats { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat-item { flex: 1; background: #0f1724; padding: 25px; border-radius: 12px; text-align: center; }
    .stat-val { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-top: 10px; }
    .add-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-bottom: 40px; align-items: end; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; }
    input, select { background: #0a0f18; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
    input:focus { border-color: var(--accent); }
    .btn-sync { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { text-align: left; padding: 15px; color: var(--muted); border-bottom: 2px solid #333; font-size: 0.8rem; text-transform: uppercase; }
    td { padding: 15px; border-bottom: 1px solid #222; font-size: 0.9rem; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
    .p-paid { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
    .w-process { background: rgba(245, 158, 11, 0.1); color: var(--process); }
    .w-complete { background: rgba(16, 185, 129, 0.2); color: #fff; border: 1px solid var(--accent); }
    .loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:100; }
  </style>
</head>
<body>
  <div id="loader" class="loader"><div style="border: 3px solid #fff; border-top: 3px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div></div>
  <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

  <div id="login" style="text-align:center; padding-top:150px">
    <div style="background:var(--card); display:inline-block; padding:40px; border-radius:16px; border:1px solid var(--accent)">
      <h2 style="margin-bottom:20px">Mirror CRM Access</h2>
      <input type="password" id="pass" placeholder="Password" style="width:250px; margin-bottom:20px"><br>
      <button onclick="auth()" class="btn-sync" style="width:100%">Enter Dashboard</button>
    </div>
  </div>

  <div id="main" class="container card-box" style="display:none">
    <div class="stats">
      <div class="stat-item">REVENUE<div id="rev" class="stat-val">€0</div></div>
      <div class="stat-item">TOTAL AUDITS<div id="cnt" class="stat-val">0</div></div>
    </div>

    <div class="add-form">
      <div>Date<input type="date" id="f_d"></div>
      <div>Time<input type="time" id="f_t" step="1"></div>
      <div>IP Address<input type="text" id="f_ip" placeholder="109.236.84.23"></div>
      <div>Client Email<input type="email" id="f_e" placeholder="client@test.com"></div>
      <div>Tier<select id="f_p"><option value="230">Basic (€230)</option><option value="250">Express (€250)</option><option value="300">Advanced (€300)</option></select></div>
      <div>Work Status<select id="f_w"><option value="Process">Process</option><option value="Complete">Complete</option></select></div>
      <button onclick="sync()" class="btn-sync">SYNC RECORD</button>
    </div>

    <table><thead><tr><th>Date / Time</th><th>Target IP</th><th>Email</th><th>Tier</th><th>Full Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>

  <script>
    const BID = "69a582c4d0ea881f40e763d3";
    const KEY = "$2a$10$S3z8IltwDwTfbcs0rgp6leyEsgIbfjXK4t8.PS1Eer1GxxuQGAtfK";
    let sales = [];
    let editId = null;

    const n = new Date();
    document.getElementById('f_d').value = n.toISOString().split('T')[0];
    document.getElementById('f_t').value = n.toTimeString().split(' ')[0];

    function auth() {
      if(document.getElementById('pass').value === "admin123$") {
        document.getElementById('login').style.display='none';
        document.getElementById('main').style.display='block';
        load();
      } else { alert("Access Denied"); }
    }

    async function load() {
      document.getElementById('loader').style.display='flex';
      try {
        const r = await fetch(`https://api.jsonbin.io/v3/b/${BID}/latest`, { headers: {"X-Master-Key": KEY, "X-Bin-Meta": "false"} });
        if(!r.ok) throw new Error(r.status);
        sales = await r.json();
        render();
      } catch(e) { alert("Load failed: " + e.message); }
      document.getElementById('loader').style.display='none';
    }

    async function sync() {
      const s = { 
        id: editId || Date.now(),
        date: document.getElementById('f_d').value + ' ' + document.getElementById('f_t').value,
        rawD: document.getElementById('f_d').value, rawT: document.getElementById('f_t').value,
        ip: document.getElementById('f_ip').value, email: document.getElementById('f_e').value,
        price: document.getElementById('f_p').value, work: document.getElementById('f_w').value
      };
      if(editId) { sales = sales.map(x => x.id === editId ? s : x); } else { sales.push(s); }
      
      document.getElementById('loader').style.display='flex';
      try {
        const r = await fetch(`https://api.jsonbin.io/v3/b/${BID}`, { method: 'PUT', headers: {"Content-Type":"application/json", "X-Master-Key":KEY}, body: JSON.stringify(sales) });
        if(!r.ok) throw new Error(r.status);
        editId = null; render();
      } catch(e) { alert("Sync failed"); }
      document.getElementById('loader').style.display='none';
    }

    function render() {
      const b = document.getElementById('rows'); b.innerHTML = ""; let r = 0;
      sales.sort((x,y)=>y.id-x.id).forEach(s => {
        r += parseInt(s.price);
        const wC = s.work === 'Process' ? 'w-process' : 'w-complete';
        b.innerHTML += `<tr><td style="font-family:monospace; color:var(--muted)">${s.date}</td><td>${s.ip}</td><td style="font-weight:600">${s.email}</td><td>€${s.price}</td><td><span class="badge p-paid">PAID</span> / <span class="badge ${wC}">${s.work}</span></td><td><button onclick="edit(${s.id})" style="background:none; border:none; cursor:pointer">✏️</button> <button onclick="del(${s.id})" style="background:none; border:none; cursor:pointer">🗑️</button></td></tr>`;
      });
      document.getElementById('rev').innerText = "€" + r;
      document.getElementById('cnt').innerText = sales.length;
    }

    function edit(id) {
      const s = sales.find(x => x.id === id);
      document.getElementById('f_d').value = s.rawD; document.getElementById('f_t').value = s.rawT;
      document.getElementById('f_ip').value = s.ip; document.getElementById('f_e').value = s.email;
      document.getElementById('f_p').value = s.price; document.getElementById('f_w').value = s.work;
      editId = id; window.scrollTo(0,0);
    }

    async function del(id) {
      if(!confirm("Delete?")) return;
      sales = sales.filter(x => x.id !== id);
      await sync();
    }
  </script>
</body>
</html>
