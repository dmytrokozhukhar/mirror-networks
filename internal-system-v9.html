<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirror CRM v1.1 (Security Audit Tracking)</title>
  <style>
    :root {
      --bg: #0a0f18; --card: #111827; --muted: #9ca3af;
      --accent: #10b981; --accent-2: #059669; --white: #f3f4f6;
    }

    body {
      font-family: Inter, system-ui, -apple-system; margin: 0;
      color: var(--white); background: var(--bg);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }

    .admin-container { max-width: 1250px; margin: 0 auto; padding: 20px; }
    
    /* Login */
    .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); width: 100%; max-width: 400px; text-align: center; }
    
    .dashboard { display: none; }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .stat-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin-top: 10px; }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

    /* --- STEALTH FORM --- */
    .add-section-wrapper { position: relative; margin-bottom: 25px; padding-top: 10px; }
    .form-trigger { height: 10px; width: 100%; background: transparent; cursor: pointer; margin-bottom: 5px; }

    .add-form { 
      background: var(--card); border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
      max-height: 0; opacity: 0; overflow: hidden; padding: 0 25px; transition: all 0.5s ease;
    }

    .add-section-wrapper:hover .add-form,
    .add-form.locked {
      max-height: 800px; opacity: 1; padding: 30px; margin-top: 5px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .add-form label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }

    input, select { 
      width: 100%; padding: 0 15px; background: #0f1724; border: 1px solid rgba(255,255,255,0.1); 
      color: white; border-radius: 10px; outline: none; height: 48px; font-size: 0.95rem;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    input:focus, select:focus { border-color: var(--accent); }

    .btn-primary { 
      background: var(--accent); color: #fff; padding: 0 20px; height: 48px; border-radius: 10px; 
      font-weight: 700; border: none; cursor: pointer; transition: 0.3s; width: 100%;
    }
    .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }

    /* Table */
    .table-container { overflow-x: auto; background: var(--card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 20px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--white); font-size: 0.9rem; }
    
    .badge-paid { background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
    .badge-refunded { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

    .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 15, 24, 0.9); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader" class="loader-overlay"><div class="loader"></div></div>

  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <h2 style="color: var(--accent); margin-bottom: 25px;">Mirror CRM Access</h2>
      <input type="password" id="adminPass" placeholder="Enter Token" style="margin-bottom: 15px;">
      <button class="btn-primary" onclick="login()">Authenticate</button>
      <p id="loginError" style="color: #ef4444; margin-top: 15px; display: none; font-weight: 600;">Access Denied</p>
    </div>
  </div>

  <div id="dashboard" class="admin-container dashboard">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1 style="font-size: 1.8rem;">Audit Dashboard <span style="color: var(--accent);">Mirror Networks</span></h1>
      <button onclick="location.reload()" style="background:#1e293b; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:600;">Sign Out</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Net Revenue</div><div class="stat-number" id="totalRevenue">€0</div></div>
      <div class="stat-card"><div class="stat-label">Total Audits</div><div class="stat-number" id="totalSales">0</div></div>
    </div>

    <div class="add-section-wrapper">
      <div class="form-trigger"></div>
      <div class="add-form" id="addForm">
        <div><label>Scan Date</label><input type="date" id="datePart"></div>
        <div><label>Scan Time</label><input type="time" id="timePart" step="1"></div>
        <div><label>Target IP / Host</label><input type="text" id="txnInput" placeholder="109.236.84.23"></div>
        <div><label>Client Email</label><input type="email" id="emailInput" placeholder="contact@client.com"></div>
        <div>
          <label>Service Tier</label>
          <select id="productInput">
            <option value="Basic Audit">Basic Vulnerability Audit (€230)</option>
            <option value="Express Mitigation">Express Risk Mitigation (€250)</option>
            <option value="Advanced Hardening">Advanced System Hardening (€300)</option>
          </select>
        </div>
        <div><label>Final Price (€)</label><input type="number" id="priceInput" value="230"></div>
        <div>
          <label>Status</label>
          <select id="statusInput">
            <option value="Paid">Paid</option>
            <option value="Refunded">Refunded</option>
          </select>
        </div>
        <div><button id="submitBtn" class="btn-primary" onclick="handleFormSubmit()">+ Sync Record</button></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date / Time</th>
            <th>Client Email</th>
            <th>Target IP</th>
            <th>Service Tier</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69977faeae596e708f384504"; 
    const API_KEY = "$2a$10$S3z8IltwDwTfbcs0rgp6leyEsgIbfjXK4t8.PS1Eer1GxxuQGAtfK";
    const PASSWORD = "admin123$"; 
    let salesData = [];
    let editingId = null;

    setNow();

    // Блокировка формы при вводе
    document.querySelectorAll('.add-form input, .add-form select').forEach(el => {
        el.addEventListener('focus', () => document.getElementById('addForm').classList.add('locked'));
    });

    function setNow() {
        const now = new Date();
        document.getElementById('datePart').value = now.toISOString().split('T')[0];
        document.getElementById('timePart').value = now.toTimeString().split(' ')[0];
    }
    
    document.getElementById('productInput').addEventListener('change', function() {
      if(this.value === "Basic Audit") document.getElementById('priceInput').value = 230;
      if(this.value === "Express Mitigation") document.getElementById('priceInput').value = 250;
      if(this.value === "Advanced Hardening") document.getElementById('priceInput').value = 300;
    });

    function login() {
      if (document.getElementById('adminPass').value === PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else { document.getElementById('loginError').style.display = 'block'; }
    }

    async function loadData() {
      showLoader(true);
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const d = await res.json();
        salesData = Array.isArray(d.record) ? d.record : [];
        renderTable();
      } catch (e) { alert("Error loading database: " + e.message); }
      showLoader(false);
    }

    async function handleFormSubmit() {
      const email = document.getElementById('emailInput').value;
      const ip = document.getElementById('txnInput').value; 
      const price = parseFloat(document.getElementById('priceInput').value);
      const status = document.getElementById('statusInput').value;
      const dateVal = document.getElementById('datePart').value;
      const timeVal = document.getElementById('timePart').value;
      
      if (!email || !ip || !dateVal || !timeVal) return alert("Please fill mandatory fields");

      showLoader(true);
      const record = { 
          id: editingId || Date.now(), 
          date: `${dateVal} ${timeVal}`,
          rawDate: dateVal, rawTime: timeVal,
          email: email, ip: ip, 
          product: document.getElementById('productInput').value, 
          price: price, status: status
      };

      if (editingId) {
          const i = salesData.findIndex(s => s.id === editingId);
          if(i !== -1) salesData[i] = record;
      } else { salesData.push(record); }

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(salesData)
        });
        editingId = null;
        document.getElementById('emailInput').value = ""; document.getElementById('txnInput').value = "";
        document.getElementById('submitBtn').innerText = "+ Sync Record";
        document.getElementById('addForm').classList.remove('locked');
        setNow(); renderTable();
      } catch (e) { alert("Save error: " + e.message); }
      showLoader(false);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ""; let revenue = 0;
      
      salesData.sort((a,b) => b.id - a.id).forEach(sale => {
        if (sale.status === 'Paid') revenue += sale.price;
        const statusBadge = sale.status === 'Paid' ? `<span class="badge-paid">Paid</span>` : `<span class="badge-refunded">Refunded</span>`;
        
        tbody.innerHTML += `
          <tr>
            <td style="font-family: monospace; color:var(--muted);">${sale.date}</td>
            <td style="font-weight:600;">${sale.email}</td>
            <td style="font-family: monospace; font-size: 0.85rem;">${sale.ip}</td>
            <td>${sale.product}</td>
            <td style="font-weight:bold; color:var(--accent);">€${sale.price}</td>
            <td>${statusBadge}</td>
            <td><button style="background:none; border:none; cursor:pointer;" onclick="deleteSale(${sale.id})">🗑️</button></td>
          </tr>`;
      });
      document.getElementById('totalRevenue').innerText = `€${revenue}`;
      document.getElementById('totalSales').innerText = salesData.length;
    }

    async function deleteSale(id) {
      if(!confirm("Delete this record?")) return;
      showLoader(true);
      salesData = salesData.filter(s => s.id !== id);
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(salesData)
        });
        renderTable();
      } catch (e) { alert("Delete error: " + e.message); }
      showLoader(false);
    }

    function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
  </script>
</body>
</html>
