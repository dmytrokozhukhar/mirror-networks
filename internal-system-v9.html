<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirror CRM v1.8 — Fulfillment Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0f18; --card: #111827; --primary: #10b981; --process: #f59e0b; --text: #f3f4f6; --muted: #9ca3af; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1350px; margin: 0 auto; padding: 20px; }
    .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); width: 350px; text-align: center; }
    .dashboard { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .stat-number { font-size: 2.8rem; font-weight: 800; color: var(--primary); margin-top: 10px; }
    .add-section-wrapper { position: relative; margin-bottom: 25px; }
    .form-trigger { height: 8px; width: 100%; background: transparent; cursor: pointer; }
    .add-form { 
      background: var(--card); border-radius: 16px; border: 1px solid var(--primary);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end;
      max-height: 0; opacity: 0; overflow: hidden; padding: 0 25px; transition: all 0.4s ease;
    }
    .add-section-wrapper:hover .add-form, .add-form.locked { max-height: 800px; opacity: 1; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    input, select { width: 100%; padding: 12px; background: #0f1724; border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none; font-size: 0.85rem; }
    .btn-sync { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; }
    .table-container { overflow-x: auto; background: var(--card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 20px; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.85rem; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
    .badge-paid { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
    .badge-process { background: rgba(245, 158, 11, 0.1); color: var(--process); }
    .badge-complete { background: rgba(16, 185, 129, 0.2); color: #fff; border: 1px solid var(--primary); }
    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,15,24,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
  </style>
</head>
<body>
  <div id="loader" class="loader"><div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div></div>
  <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <h2>Mirror CRM</h2>
      <input type="password" id="adminPass" placeholder="Token" style="margin-bottom: 20px; width: 100%;">
      <button class="btn-sync" onclick="login()">Authenticate</button>
    </div>
  </div>

  <div id="dashboard" class="container dashboard">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1>Fulfillment <span style="color: var(--primary);">Engine</span></h1>
      <button onclick="location.reload()" style="background:#1e293b; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Sign Out</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div>NET REVENUE</div><div class="stat-number" id="totalRevenue">€0</div></div>
      <div class="stat-card"><div>TOTAL AUDITS</div><div class="stat-number" id="totalSales">0</div></div>
    </div>

    <div class="add-section-wrapper">
      <div class="form-trigger"></div>
      <div class="add-form" id="addForm">
        <div style="grid-column: 1 / -1; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; font-size: 0.8rem;">STEP 1: ORDER DATA (PAYPAL)</div>
        <div><label>Order Date</label><input type="date" id="order_date"></div>
        <div><label>Order Time</label><input type="time" id="order_time" step="1"></div>
        <div><label>Client Email</label><input type="email" id="f_email" placeholder="client@paypal.com"></div>
        <div><label>Target IP</label><input type="text" id="f_ip" placeholder="109.236.84.23"></div>
        <div><label>Audit Tier</label>
          <select id="f_package">
            <option value="Basic Audit">Basic (€230)</option>
            <option value="Express Mitigation">Express (€250)</option>
            <option value="Advanced Hardening">Advanced (€300)</option>
          </select>
        </div>
        
        <div style="grid-column: 1 / -1; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 15px; margin-bottom: 10px; font-weight: bold; font-size: 0.8rem;">STEP 2: DELIVERY DATA (FULFILLMENT)</div>
        <div><label>Work Status</label>
          <select id="f_work" onchange="toggleDeliveryInputs(this.value)">
            <option value="Process">In Process</option>
            <option value="Complete">Completed</option>
          </select>
        </div>
        <div><label>Delivery Date</label><input type="date" id="done_date" disabled></div>
        <div><label>Delivery Time</label><input type="time" id="done_time" step="1" disabled></div>
        <div><button id="submitBtn" class="btn-sync" onclick="handleSync()">Sync Cloud</button></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Order Date/Time</th>
            <th>Client & Asset</th>
            <th>Tier</th>
            <th>Status</th>
            <th>Delivery Date/Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69a58c0043b1c97be9ac1157"; 
    const API_KEY = "$2a$10$GwRGAuZ3c9u2DkrBDCDEhukA3.lfziuP55HXC5.PZQAY8uZyuXVtG";
    let salesData = [];
    let editingId = null;

    function resetTimes() {
      const d = new Date();
      document.getElementById('order_date').value = d.toISOString().split('T')[0];
      document.getElementById('order_time').value = d.toTimeString().split(' ')[0];
      document.getElementById('done_date').value = "";
      document.getElementById('done_time').value = "";
    }

    function toggleDeliveryInputs(val) {
      const isComplete = (val === 'Complete');
      document.getElementById('done_date').disabled = !isComplete;
      document.getElementById('done_time').disabled = !isComplete;
      if(isComplete) {
        const d = new Date();
        document.getElementById('done_date').value = d.toISOString().split('T')[0];
        document.getElementById('done_time').value = d.toTimeString().split(' ')[0];
      }
    }

    function login() {
      if (document.getElementById('adminPass').value === "admin123$") {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else { alert("Denied"); }
    }

    async function loadData() {
      showLoader(true);
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' } });
        salesData = await res.json();
        renderTable();
      } catch (e) { alert("Load Error"); }
      showLoader(false); resetTimes();
    }

    async function handleSync() {
      const email = document.getElementById('f_email').value;
      const ip = document.getElementById('f_ip').value;
      if (!email || !ip) return alert("Fill mandatory data");

      showLoader(true);
      const pkg = document.getElementById('f_package').value;
      const price = pkg.includes('230') ? 230 : (pkg.includes('250') ? 250 : 300);

      const record = {
        id: editingId || Date.now(),
        orderTs: document.getElementById('order_date').value + ' ' + document.getElementById('order_time').value,
        doneTs: document.getElementById('f_work').value === 'Complete' ? document.getElementById('done_date').value + ' ' + document.getElementById('done_time').value : null,
        email, ip, product: pkg, price,
        status: "Paid",
        work: document.getElementById('f_work').value
      };

      if (editingId) {
        const i = salesData.findIndex(s => s.id === editingId);
        salesData[i] = record;
      } else { salesData.push(record); }

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(salesData) });
        editingId = null; document.getElementById('addForm').classList.remove('locked');
        renderTable(); resetTimes();
      } catch (e) { alert("Sync failed"); }
      showLoader(false);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ""; let rev = 0;
      salesData.sort((a,b) => b.id - a.id).forEach(s => {
        if (s.status === 'Paid') rev += s.price;
        const wClass = s.work === 'Process' ? 'badge-process' : 'badge-complete';
        const deliveryText = s.doneTs ? s.doneTs : `<span style="color:var(--process); font-weight:600">⌛ In Queue</span>`;
        
        tbody.innerHTML += `
          <tr>
            <td style="font-family:monospace; color:var(--muted)">${s.orderTs}</td>
            <td><div style="font-weight:600">${s.email}</div><div style="font-family:monospace; font-size:0.75rem; color:var(--muted)">${s.ip}</div></td>
            <td>${s.product}</td>
            <td><span class="badge badge-paid">PAID</span> / <span class="badge ${wClass}">${s.work}</span></td>
            <td style="font-family:monospace">${deliveryText}</td>
            <td><button style="background:none; border:none; cursor:pointer" onclick="editRec(${s.id})">✏️</button></td>
          </tr>`;
      });
      document.getElementById('totalRevenue').innerText = `€${rev}`;
      document.getElementById('totalSales').innerText = salesData.length;
    }

    function editRec(id) {
      const s = salesData.find(x => x.id === id);
      const [oD, oT] = s.orderTs.split(' ');
      document.getElementById('order_date').value = oD;
      document.getElementById('order_time').value = oT;
      document.getElementById('f_ip').value = s.ip;
      document.getElementById('f_email').value = s.email;
      document.getElementById('f_package').value = s.product;
      document.getElementById('f_work').value = s.work;
      toggleDeliveryInputs(s.work);
      if(s.doneTs) {
        const [dD, dT] = s.doneTs.split(' ');
        document.getElementById('done_date').value = dD;
        document.getElementById('done_time').value = dT;
      }
      editingId = id; document.getElementById('addForm').classList.add('locked');
      window.scrollTo(0,0);
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
  </script>
</body>
</html>
