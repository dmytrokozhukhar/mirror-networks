<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirror CRM v1.6 — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f18; --card: #111827; --primary: #10b981; 
      --process: #f59e0b; --text: #f3f4f6; --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1250px; margin: 0 auto; padding: 20px; }
    
    /* Login */
    .login-wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.2); width: 350px; text-align: center; }
    .login-box h2 { margin-bottom: 25px; color: var(--primary); font-weight: 800; }
    
    .dashboard { display: none; }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; transition: 0.3s; }
    .stat-card:hover { border-color: var(--primary); }
    .stat-number { font-size: 2.8rem; font-weight: 800; color: var(--primary); margin-top: 10px; }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; }

    /* Stealth Form */
    .add-section-wrapper { position: relative; margin-bottom: 25px; }
    .form-trigger { height: 8px; width: 100%; background: transparent; cursor: pointer; }
    .add-form { 
      background: var(--card); border-radius: 16px; border: 1px solid var(--primary);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; align-items: end;
      max-height: 0; opacity: 0; overflow: hidden; padding: 0 25px; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .add-section-wrapper:hover .add-form, .add-form.locked {
      max-height: 600px; opacity: 1; padding: 30px; margin-top: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    input, select { 
      width: 100%; padding: 12px; background: #0f1724; border: 1px solid rgba(255,255,255,0.1); 
      color: white; border-radius: 8px; outline: none; font-size: 0.9rem; transition: 0.3s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(16, 185, 129, 0.1); }
    input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .btn-sync { 
      background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 8px; 
      font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; text-transform: uppercase;
    }
    .btn-sync:hover { background: #059669; transform: translateY(-1px); }

    /* Table */
    .table-container { overflow-x: auto; background: var(--card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 20px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.08); letter-spacing: 1px; }
    td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; }
    
    /* Badges */
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: inline-block; }
    .badge-paid { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
    .badge-refund { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .badge-process { background: rgba(245, 158, 11, 0.1); color: var(--process); }
    .badge-complete { background: rgba(16, 185, 129, 0.2); color: #fff; border: 1px solid var(--primary); }

    .action-btns { display: flex; gap: 12px; opacity: 0; transition: 0.2s; justify-content: flex-end; }
    tr:hover .action-btns { opacity: 1; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.2rem; filter: grayscale(1); transition: 0.2s; }
    .btn-icon:hover { filter: grayscale(0); transform: scale(1.2); }

    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,15,24,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
  </style>
</head>
<body>
  <div id="loader" class="loader"><div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite;"></div></div>
  <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <h2>Mirror CRM</h2>
      <input type="password" id="adminPass" placeholder="Security Token" style="margin-bottom: 20px; width: 100%;">
      <button class="btn-sync" onclick="login()">Authenticate</button>
    </div>
  </div>

  <div id="dashboard" class="container dashboard">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;">
      <h1 style="font-weight: 800;">Audit Engine <span style="color: var(--primary);">Mirror Networks</span></h1>
      <button onclick="location.reload()" style="background:#1e293b; color:white; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight: 600;">Sign Out</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Verified Revenue</div><div class="stat-number" id="totalRevenue">€0</div></div>
      <div class="stat-card"><div class="stat-label">Active Deployments</div><div class="stat-number" id="totalSales">0</div></div>
    </div>

    <div class="add-section-wrapper">
      <div class="form-trigger"></div>
      <div class="add-form" id="addForm">
        <div><label>Scan Date</label><input type="date" id="f_date"></div>
        <div><label>Scan Time</label><input type="time" id="f_time" step="1"></div>
        <div><label>Target IP</label><input type="text" id="f_ip" placeholder="109.236.84.23"></div>
        <div><label>Client Email</label><input type="email" id="f_email" placeholder="billing@client.com"></div>
        <div><label>Audit Tier</label>
          <select id="f_package">
            <option value="Basic Audit">Basic Audit (€230)</option>
            <option value="Express Mitigation">Express Mitigation (€250)</option>
            <option value="Advanced Hardening">Advanced Hardening (€300)</option>
          </select>
        </div>
        <div><label>Pay Status</label>
          <select id="f_status">
            <option value="Paid">Paid</option>
            <option value="Refunded">Refunded</option>
          </select>
        </div>
        <div><label>Work Status</label>
          <select id="f_work">
            <option value="Process">In Process</option>
            <option value="Complete">Completed</option>
          </select>
        </div>
        <div><button id="submitBtn" class="btn-sync" onclick="handleSync()">Sync Cloud</button></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Target Asset</th>
            <th>Client Identity</th>
            <th>Service Tier</th>
            <th>Workflow Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69a582c4d0ea881f40e763d3"; 
    const API_KEY = "$2a$10$S3z8IltwDwTfbcs0rgp6leyEsgIbfjXK4t8.PS1Eer1GxxuQGAtfK";
    let salesData = [];
    let editingId = null;

    // Авто-заполнение даты
    const d = new Date();
    document.getElementById('f_date').value = d.toISOString().split('T')[0];
    document.getElementById('f_time').value = d.toTimeString().split(' ')[0];

    function login() {
      if (document.getElementById('adminPass').value === "admin123$") {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else { alert("Access Denied"); }
    }

    async function loadData() {
      showLoader(true);
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
          headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' } 
        });
        if (!res.ok) throw new Error(res.status);
        salesData = await res.json();
        renderTable();
      } catch (e) { alert("Load Error: Check Bin ID or API Key"); }
      showLoader(false);
    }

    async function handleSync() {
      const email = document.getElementById('f_email').value;
      const ip = document.getElementById('f_ip').value;
      if (!email || !ip) return alert("Email and Target IP are mandatory.");

      showLoader(true);
      const pkg = document.getElementById('f_package').value;
      const price = pkg.includes('230') ? 230 : (pkg.includes('250') ? 250 : 300);

      const record = {
        id: editingId || Date.now(),
        date: document.getElementById('f_date').value + ' ' + document.getElementById('f_time').value,
        rawDate: document.getElementById('f_date').value,
        rawTime: document.getElementById('f_time').value,
        email, ip, product: pkg, price,
        status: document.getElementById('f_status').value,
        work: document.getElementById('f_work').value
      };

      if (editingId) {
        const i = salesData.findIndex(s => s.id === editingId);
        salesData[i] = record;
      } else { salesData.push(record); }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(salesData)
        });
        if(!res.ok) throw new Error();
        editingId = null;
        document.getElementById('addForm').classList.remove('locked');
        document.getElementById('submitBtn').innerText = "Sync Cloud";
        renderTable();
      } catch (e) { alert("Sync failed. Check connection."); }
      showLoader(false);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ""; let rev = 0;
      salesData.sort((a,b) => b.id - a.id).forEach(s => {
        if (s.status === 'Paid') rev += s.price;
        const pBadge = s.status === 'Paid' ? 'badge-paid' : 'badge-refund';
        const wBadge = s.work === 'Process' ? 'badge-process' : 'badge-complete';
        
        tbody.innerHTML += `
          <tr>
            <td style="font-family:monospace; color:var(--muted)">${s.date}</td>
            <td style="font-family:monospace">${s.ip}</td>
            <td style="font-weight:600">${s.email}</td>
            <td>${s.product}</td>
            <td><span class="badge ${pBadge}">${s.status}</span> / <span class="badge ${wBadge}">${s.work}</span></td>
            <td>
              <div class="action-btns">
                <button class="btn-icon" onclick="editRec(${s.id})">✏️</button>
                <button class="btn-icon" onclick="delRec(${s.id})">🗑️</button>
              </div>
            </td>
          </tr>`;
      });
      document.getElementById('totalRevenue').innerText = `€${rev}`;
      document.getElementById('totalSales').innerText = salesData.length;
    }

    function editRec(id) {
      const s = salesData.find(x => x.id === id);
      document.getElementById('f_date').value = s.rawDate;
      document.getElementById('f_time').value = s.rawTime;
      document.getElementById('f_ip').value = s.ip;
      document.getElementById('f_email').value = s.email;
      document.getElementById('f_package').value = s.product;
      document.getElementById('f_status').value = s.status;
      document.getElementById('f_work').value = s.work;
      editingId = id; document.getElementById('submitBtn').innerText = "Update Record";
      document.getElementById('addForm').classList.add('locked');
      window.scrollTo(0,0);
    }

    async function delRec(id) {
      if(!confirm("Destroy this record permanently?")) return;
      salesData = salesData.filter(x => x.id !== id);
      await handleSync();
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
  </script>
</body>
</html>
